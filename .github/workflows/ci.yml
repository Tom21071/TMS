name: CI - Ruff & Django Tests (Compose)

on:
  pull_request:
    branches:
      - "**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run Ruff outside Docker for speed
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

      # Start your docker-compose stack
      - name: Build and start containers
        run: docker compose up -d --build

      - name: Show running containers
        run: docker compose ps

      - name: Wait for DB
        run: |
          echo "Waiting for database..."
          sleep 60

      # Run tests inside the `web` service (not "django")
      - name: Run Django tests
        run: docker compose exec -T web pytest

      # Show logs if something fails (for easier debugging)
      - name: Show container logs
        if: failure()
        run: docker compose logs
