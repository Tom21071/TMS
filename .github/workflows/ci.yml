name: CI - Ruff & Django Tests (Compose)

on:
  pull_request:
    branches:
      - "**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run Ruff on host (fast, no need for Docker)
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

      # Start your docker-compose stack
      - name: Build and start containers
        run: docker compose up -d --build

      # (Optional) Wait a bit for DB to be ready
      - name: Wait for DB
        run: |
          echo "Waiting for database..."
          sleep 10

      # Run tests inside your django container
      - name: Run Django tests
        run: docker compose exec -T django pytest
